# Builds the docs site with MkDocs Material and publishes it to GitHub Pages.
# GitHub Pages is free for public repositories only. No secrets: the Pages deploy uses the
# workflow's own short-lived OIDC token (id-token: write).
name: pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict -d site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with: {path: site}
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
